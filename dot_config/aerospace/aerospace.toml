# AeroSpace, keymap mirrors GlazeWM's defaults so Mac and Windows share one muscle memory.
# Moves and focus cross monitor edges like GlazeWM (all-monitors-outer-frame).
config-version = 2
start-at-login = true

persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8']
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

on-focus-changed = ['move-mouse window-lazy-center']
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

# 1-6 on the external (top) display, 7-8 on the built-in; falls back when undocked
[workspace-to-monitor-force-assignment]
1 = ['T34w-30', 'main']
2 = ['T34w-30', 'main']
3 = ['T34w-30', 'main']
4 = ['T34w-30', 'main']
5 = ['T34w-30', 'main']
6 = ['T34w-30', 'main']
7 = ['built-in', 'secondary', 'main']
8 = ['built-in', 'secondary', 'main']

[mode.main.binding]
alt-enter = 'exec-and-forget open -na Ghostty'

# focus / move: past the edge of a screen = onto the next screen (GlazeWM behaviour)
alt-h = 'focus --boundaries all-monitors-outer-frame left'
alt-j = 'focus --boundaries all-monitors-outer-frame down'
alt-k = 'focus --boundaries all-monitors-outer-frame up'
alt-l = 'focus --boundaries all-monitors-outer-frame right'
alt-shift-h = 'move --boundaries all-monitors-outer-frame left'
alt-shift-j = 'move --boundaries all-monitors-outer-frame down'
alt-shift-k = 'move --boundaries all-monitors-outer-frame up'
alt-shift-l = 'move --boundaries all-monitors-outer-frame right'

# workspaces (alt-shift-N moves the window and follows it, like GlazeWM)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-s = 'workspace next'
alt-a = 'workspace prev'
alt-d = 'workspace-back-and-forth'
alt-shift-a = 'move-workspace-to-monitor --wrap-around prev'
alt-shift-f = 'move-workspace-to-monitor --wrap-around next'

# window state
alt-f = 'fullscreen'
alt-shift-space = 'layout floating tiling'
alt-v = 'layout horizontal vertical'
alt-m = 'macos-native-minimize'
alt-shift-q = 'close'
alt-shift-r = 'reload-config'
alt-r = 'mode resize'

# AeroSpace-only extras (no GlazeWM equivalent)
ctrl-alt-h = 'join-with left'
ctrl-alt-j = 'join-with down'
ctrl-alt-k = 'join-with up'
ctrl-alt-l = 'join-with right'

[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
k = 'resize height -50'
j = 'resize height +50'
esc = 'mode main'
enter = 'mode main'
alt-r = 'mode main'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'
